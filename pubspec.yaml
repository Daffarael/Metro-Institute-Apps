name: metro_institute_app
description: "Metro Institute Mobile App - Platform Edukasi Digital"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ──────────────────────────────────────────
  go_router: ^15.1.2

  # ── State Management ─────────────────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # ── Dependency Injection ─────────────────────────────────
  get_it: ^8.0.3

  # ── Network ──────────────────────────────────────────────
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # ── Local Storage ────────────────────────────────────────
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # ── Firebase (Push Notification only) ────────────────────
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # ── UI Components ─────────────────────────────────────────
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  lottie: ^3.3.1
  shimmer: ^3.0.0

  # ── Media & Files ─────────────────────────────────────────
  image_picker: ^1.1.2
  file_picker: ^10.0.0
  permission_handler: ^12.0.0+1
  path_provider: ^2.1.5

  # ── Video Player ──────────────────────────────────────────
  video_player: ^2.10.0
  chewie: ^1.10.0

  # ── Charts ────────────────────────────────────────────────
  fl_chart: ^0.70.2

  # ── Auth ──────────────────────────────────────────────────
  google_sign_in: ^6.2.2

  # ── Payment / Webview ─────────────────────────────────────
  webview_flutter: ^4.11.0
  url_launcher: ^6.3.1

  # ── File Download ─────────────────────────────────────────
  open_file: ^3.5.10

  # ── Utilities ─────────────────────────────────────────────
  intl: ^0.20.2
  timeago: ^3.7.0
  flutter_animate: ^4.5.2
  connectivity_plus: ^6.1.3

  # ── Icons ─────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.5
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
